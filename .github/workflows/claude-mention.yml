name: Claude mention

# Manual re-trigger / Q&A: comment `@claude` on a PR (or PR review comment) and
# Claude responds. Use this to ask for a re-review after addressing feedback,
# or to ask follow-up questions about the change.
#
# `issue_comment` / `pull_request_review_comment` always run in the BASE repo
# context, so the ANTHROPIC_API_KEY secret is available even for fork PRs.
# By default the action only acts on comments from users with write access.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  respond:
    # Only react to @claude on pull requests (not plain issues), and ignore bots.
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.user.type == 'User' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # No `prompt` here → tag mode: the action reads the @claude comment as
          # the instruction. `--append-system-prompt` nudges the reply language
          # without leaving tag mode. Same static, read-only tool restrictions
          # as the automatic review.
          claude_args: |
            --model claude-sonnet-4-6
            --append-system-prompt "Odpovídej vždy česky."
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
